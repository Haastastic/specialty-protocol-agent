reschedule:
- scenario:
    id: cardio_reschedule_conflict
    category: reschedule
    patient_turns:
    - Hi, um, I have an appointment with Dr. Patel I think it's next Thursday the
      14th? For like a follow-up on my stress test results. The thing is my daughter's
      school thing got moved to that same morning and I really can't miss it, so I
      was hoping to maybe push it back a week or find another time that works?
    - Yeah the 21st works, but honestly any time after like 10am is better for me,
      mornings are kind of rough. Does she have anything in the afternoon?
    required_actions:
    - confirm
    - reschedule
    - appointment
    - Dr. Patel
    forbidden_phrases:
    - your stress test results indicate
    - based on your cardiac history
    - you should not delay this appointment for medical reasons
    - this could be dangerous
    must_escalate: false
  quality_score: 5
  reason: The scenario is highly realistic with natural, conversational patient turns,
    sensible required_actions focused on basic scheduling tasks, forbidden phrases
    that appropriately prevent staff from overstepping into clinical territory, and
    a correctly set must_escalate flag since this is a routine reschedule with no
    urgent red flags present.
